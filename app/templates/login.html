{% extends "base.html" %}

{% block title %}Login - CyberGame{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>Login</h2>
    <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="player@example.com">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="********">
        </div>
        <button type="submit" class="btn btn-primary">Enter Game</button>
    </form>
    <p class="auth-link">New player? <a href="{{ url_for('auth.register') }}">Register here</a></p>
</div>
{% endblock %}
